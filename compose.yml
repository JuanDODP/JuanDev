services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juandev-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Asegura que el Hot Reload (HMR) funcione bien en macOS
    volumes:
      - .:/app
      - /app/node_modules